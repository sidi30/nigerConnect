# =============================================================================
# Prometheus — NigerConnect metrics
# =============================================================================
# Scrapes three sources:
#   - the NestJS API (/metrics, prom-client)  → req/s, latency, error rate
#   - cAdvisor                                → per-container CPU / RAM
#   - node-exporter                           → host CPU / RAM / disk
#
# The VPS is SHARED (~12 projects, ~58 containers). cAdvisor reports all of
# them, so `metric_relabel_configs` below keeps only what we're entitled to
# store: NigerConnect containers in full, plus one cheap liveness series per
# foreign container so the console can still show how loaded the host is.
#
# Retention (30 days) is set on the command line — see docker-compose.monitoring.yml.
# =============================================================================

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  external_labels:
    project: nigerconnect

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------------------------------------------------------------------
  # NestJS API. Reached by CONTAINER NAME over the app's private network
  # (`nigerconnect-internal`) — service-name DNS doesn't cross compose projects.
  # In dev, docker-compose.monitoring.dev.yml maps that name to the host gateway
  # so the same config scrapes an API running under `pnpm dev`.
  # ---------------------------------------------------------------------------
  - job_name: nigerconnect-api
    metrics_path: /metrics
    static_configs:
      - targets: ["nigerconnect-api:3000"]
        labels:
          service: api
    # /metrics is NOT protected by the Traefik edge deny alone: nigerconnect-api
    # shares the `traefik-public` network with unrelated projects, and any of
    # their containers can reach http://nigerconnect-api:3000/metrics directly,
    # never crossing Traefik. The bearer token is what actually closes that.
    # The token lives in monitoring/prometheus/metrics_token (gitignored, created
    # by deploy-monitoring.sh) and must equal METRICS_TOKEN in .env.prod.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token

  - job_name: cadvisor
    static_configs:
      - targets: ["nigerconnect-cadvisor:8080"]
    metric_relabel_configs:
      # Keep, in order: every container_last_seen (1 series per container, gives
      # the host-wide container count), all container_* series for our own
      # containers, and cAdvisor's own machine/process series. Everything else —
      # i.e. the neighbouring projects' CPU/memory/network series — is dropped
      # before it is ever written to disk.
      #
      # Matched on IMAGE, not on name: Docker 29 stores images in containerd, so
      # cAdvisor can't resolve container names and labels every series with the
      # raw container ID instead. The image is the only stable identifier left.
      # redis:7-alpine and minio/minio are excluded on purpose — several projects
      # on this host run them, and we are not entitled to their numbers.
      - source_labels: [__name__, image]
        separator: ";"
        regex: "container_last_seen;.*|container_[a-z_]+;(?:docker\\.io/)?(?:library/)?nigerconnect-(?:api|web):.*|container_[a-z_]+;(?:docker\\.io/)?postgis/postgis:.*|(?:machine|cadvisor|go|process)_.*;.*"
        action: keep

  - job_name: node-exporter
    static_configs:
      - targets: ["nigerconnect-node-exporter:9100"]
